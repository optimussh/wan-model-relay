name: Relay Audio Models Bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Aggressive disk cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/lib/jvm /usr/local/share/powershell /opt/microsoft /opt/google || true
          sudo docker system prune -af || true

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Hugging Face Hub
        run: python -m pip install "huggingface_hub==0.36.0"

      - name: Download Models & Dependencies
        run: |
          set -euo pipefail
          mkdir -p bundle/models/qwen3-customvoice bundle/models/cosyvoice3
          mkdir -p bundle/wheels/qwen3 bundle/wheels/cosyvoice3
          mkdir -p bundle/source
          
          echo "1. Downloading Qwen3 Model..."
          huggingface-cli download Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice --local-dir bundle/models/qwen3-customvoice
          
          echo "2. Downloading CosyVoice3 Model..."
          huggingface-cli download FunAudioLLM/Fun-CosyVoice3-0.5B-2512 --local-dir bundle/models/cosyvoice3
          
          echo "3. Downloading PyTorch for Qwen3..."
          python -m pip download --dest bundle/wheels/qwen3 --index-url "https://download.pytorch.org/whl/cu118" "torch==2.6.0+cu118" "torchaudio==2.6.0+cu118"
          
          echo "4. Downloading PyTorch for CosyVoice3..."
          python -m pip download --dest bundle/wheels/cosyvoice3 --index-url "https://download.pytorch.org/whl/cu118" "torch==2.3.1+cu118" "torchaudio==2.3.1+cu118"
          
          echo "5. Cloning CosyVoice Source..."
          git clone --recursive https://github.com/QwenAudio/CosyVoice.git bundle/source/CosyVoice

      - name: Tar, Split and Checksum (On-the-fly)
        run: |
          tar -cvf - bundle | split -b 1900M -d - bundle.tar.part_
          cat bundle.tar.part_* | sha256sum | awk '{print $1 "  bundle.tar"}' > bundle_sha256.txt
          rm -rf bundle

      - name: Sequential Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 기존에 실패한 찌꺼기 릴리즈가 있다면 삭제 (오류 방지)
          gh release delete relay-audio -y || true
          
          # 2. 새 릴리즈 생성
          gh release create relay-audio -t "Relay Audio Models & Wheels Bundle" -n "Sequential upload"
          
          # 3. 파일 한 개씩 순서대로 업로드
          echo "Uploading SHA256 file..."
          gh release upload relay-audio bundle_sha256.txt
          
          for f in bundle.tar.part_*; do
            echo "Uploading $f..."
            gh release upload relay-audio "$f"
          done
