name: Relay Wan Model

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: 'Hugging Face Direct Download URL'
        required: true
        default: 'https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors'
      filename:
        description: 'Original Filename'
        required: true
        default: 'wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors'
      tag:
        description: 'Release tag (파일마다 다르게)'
        required: true
        default: 'relay-high'

permissions:
  contents: write

jobs:
  split-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Aggressive disk cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/lib/jvm /usr/local/share/powershell \
            /opt/microsoft /opt/google || true
          sudo docker system prune -af || true
          df -h

      - name: Download with fail-fast
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors \
            -o "${{ github.event.inputs.filename }}" \
            "${{ github.event.inputs.model_url }}"
          ls -lh "${{ github.event.inputs.filename }}"
          BYTES=\( (stat -c%s " \){{ github.event.inputs.filename }}")
          echo "DOWNLOADED_BYTES=$BYTES"
          if [ "$BYTES" -lt 100000000 ]; then
            echo "File too small. Got HTML/error page, not the model."
            head -c 200 "${{ github.event.inputs.filename }}" || true
            exit 1
          fi

      - name: SHA256
        run: sha256sum "${{ github.event.inputs.filename }}" | tee original_sha256.txt

      - name: Split 1.9GB then delete original
        run: |
          set -euo pipefail
          split -b 1900M -d "\( {{ github.event.inputs.filename }}" " \){{ github.event.inputs.filename }}.part_"
          rm -f "${{ github.event.inputs.filename }}"
          ls -lh
          df -h

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Relay ${{ github.event.inputs.filename }}"
          files: |
            ${{ github.event.inputs.filename }}.part_*
            original_sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
